<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f4ebdd"/>
      <stop offset="100%" stop-color="#e8d9c4"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="100%" stop-color="#2a160d"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="100%" stop-color="#150a06"/>
    </linearGradient>
  </defs>
  
  <!-- Outer decorative orbit -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#d9c2a7" stroke-width="2" stroke-dasharray="6 5"/>
  
  <!-- Main Background Disc -->
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)" stroke="#b56b37" stroke-width="2.5"/>
  
  <!-- Hoodie Torso -->
  <path d="M42 184 C44 144 66 130 84 126 L90 140 L110 140 L116 126 C134 130 156 144 158 184 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Hoodie Zipper & Strings -->
  <line x1="100" y1="140" x2="100" y2="184" stroke="#b56b37" stroke-width="2" stroke-dasharray="2 2"/>
  <path d="M84 126 L93 146 L107 146 L116 126" fill="none" stroke="#b56b37" stroke-width="2"/>
  
  <!-- White T-shirt crew neck -->
  <path d="M88 124 C94 132 106 132 112 124" fill="none" stroke="#fcfaf7" stroke-width="3"/>
  
  <!-- Neck -->
  <rect x="88" y="106" width="24" height="22" fill="#e7bca0" rx="4"/>
  <path d="M88 114 C94 120 106 120 112 114" fill="#d9a888" opacity="0.6"/>
  
  <!-- Head & Ears -->
  <circle cx="63" cy="83" r="8" fill="#e7bca0"/>
  <circle cx="137" cy="83" r="8" fill="#e7bca0"/>
  <ellipse cx="100" cy="82" rx="35" ry="39" fill="#f4cbb0"/>
  
  <!-- Hair (Modern textured developer style) -->
  <path d="M63 74 C60 48 78 33 100 33 C123 33 140 48 137 74 C132 61 120 54 100 54 C78 54 67 61 63 74 Z" fill="url(#hairGrad)"/>
  <path d="M68 58 Q82 43 104 43 Q122 43 132 55 Q118 40 98 40 Q77 40 68 58 Z" fill="#442617" opacity="0.7"/>
  
  <!-- Eyebrows -->
  <path d="M77 67 Q87 63 93 66" fill="none" stroke="#2a160d" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M107 66 Q113 63 123 67" fill="none" stroke="#2a160d" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Modern Stylish Spectacles -->
  <rect x="73" y="70" width="22" height="17" rx="5" fill="rgba(255,255,255,0.3)" stroke="#2a160d" stroke-width="2.2"/>
  <rect x="105" y="70" width="22" height="17" rx="5" fill="rgba(255,255,255,0.3)" stroke="#2a160d" stroke-width="2.2"/>
  <line x1="95" y1="78" x2="105" y2="78" stroke="#2a160d" stroke-width="2.2"/>
  
  <!-- Spectacle Glint -->
  <line x1="76" y1="73" x2="82" y2="73" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <line x1="108" y1="73" x2="114" y2="73" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Eyes -->
  <circle cx="84" cy="79" r="3.2" fill="#2a160d"/>
  <circle cx="85" cy="78" r="1" fill="#ffffff"/>
  <circle cx="116" cy="79" r="3.2" fill="#2a160d"/>
  <circle cx="117" cy="78" r="1" fill="#ffffff"/>
  
  <!-- Nose -->
  <path d="M98 83 Q100 89 103 88" fill="none" stroke="#cf9977" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M91 96 Q100 103 109 96" fill="none" stroke="#2a160d" stroke-width="2.4" stroke-linecap="round"/>
  
  <!-- CSE / Developer Pin on Hoodie -->
  <circle cx="74" cy="154" r="9.5" fill="#b56b37" stroke="#f4ebdd" stroke-width="1.5"/>
  <text x="74" y="157.5" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
</svg>

